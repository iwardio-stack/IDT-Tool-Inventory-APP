name: Build IDT Tool Inventory APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build FINAL APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK components
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Tool Inventory ZIP
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'IDT-Tool-Inventory-APP-FULL.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: IDT Tool Inventory ZIP was not found."
            exit 1
          fi

          echo "Found project ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract complete Android project
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/idt-project"
          mkdir -p "$RUNNER_TEMP/idt-project"

          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/idt-project"

          echo "Extracted project:"
          find "$RUNNER_TEMP/idt-project" -maxdepth 3 -type f | sort

      - name: Locate Android project
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "$RUNNER_TEMP/idt-project/settings.gradle" ]; then
            PROJECT_DIR="$RUNNER_TEMP/idt-project"
          else
            PROJECT_DIR="$(find "$RUNNER_TEMP/idt-project" -name settings.gradle -type f -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Verify Android project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "===== PROJECT FILES ====="
          find . -maxdepth 4 -type f | sort

          echo "===== SETTINGS.GRADLE ====="
          cat settings.gradle

          echo "===== BUILD.GRADLE ====="
          cat build.gradle

          echo "===== APP BUILD.GRADLE ====="
          cat app/build.gradle

      - name: Build DEBUG APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      - name: Find generated APK
        shell: bash
        run: |
          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated:"
          echo "$APK_FILE"

          echo "APK_FILE=$APK_FILE" >> "$GITHUB_ENV"

      - name: Rename FINAL APK
        shell: bash
        run: |
          cp "$APK_FILE" \
            "$RUNNER_TEMP/IDT-Tool-Inventory-FINAL.apk"

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-FINAL-APK
          path: ${{ runner.temp }}/IDT-Tool-Inventory-FINAL.apk
          if-no-files-found: error

      - name: Build complete
        shell: bash
        run: |
          echo "======================================"
          echo " IDT TOOL INVENTORY APK BUILD COMPLETE"
          echo "======================================"
          echo "FINAL APK:"
          echo "$RUNNER_TEMP/IDT-Tool-Inventory-FINAL.apk"
