name: Build IDT Tool Inventory APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FINAL APK
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. JAVA 17
      # ============================================
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================
      # 3. GRADLE 8.9
      # ============================================
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'


      # ============================================
      # 4. FIND AND PREPARE ANDROID SDK
      # ============================================
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "ANDROID SDK"
          echo "======================================"

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER=$(find /usr/local/lib/android/sdk \
              -type f \
              -name sdkmanager \
              2>/dev/null | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager could not be found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          echo "Accepting Android SDK licenses..."
          yes | "$SDKMANAGER" --licenses || true

          echo "Installing required Android packages..."

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK preparation complete."


      # ============================================
      # 5. FIND INVENTORY ZIP
      # ============================================
      - name: Find Tool Inventory ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR TOOL INVENTORY ZIP"
          echo "======================================"

          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname 'IDT-Tool-Inventory*.zip' \
            -not -path './.git/*' \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo ""
            echo "ERROR: Tool Inventory ZIP was not found."
            echo ""
            echo "Files currently in repository:"
            find . -maxdepth 4 -type f \
              -not -path './.git/*'
            exit 1
          fi

          echo ""
          echo "FOUND:"
          echo "$ZIP_FILE"

          echo "$ZIP_FILE" > inventory_zip.txt


      # ============================================
      # 6. EXTRACT PROJECT
      # ============================================
      - name: Extract Tool Inventory project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "EXTRACTING TOOL INVENTORY PROJECT"
          echo "======================================"

          ZIP_FILE=$(cat inventory_zip.txt)

          rm -rf build-project

          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          echo ""
          echo "PROJECT EXTRACTED"
          echo ""
          echo "Project files:"
          
          find build-project \
            -maxdepth 5 \
            -type f \
            | sort \
            | head -200


      # ============================================
      # 7. LOCATE ANDROID PROJECT
      # ============================================
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID GRADLE PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          SETTINGS_FILE=$(find build-project \
            -type f \
            \( \
              -name "settings.gradle" \
              -o \
              -name "settings.gradle.kts" \
            \) \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then

            BUILD_FILE=$(find build-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
              \) \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi

          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo ""
            echo "ERROR: Android Gradle project could not be found."
            echo ""
            echo "Gradle files found:"
            
            find build-project \
              -type f \
              \( \
                -name "build.gradle" \
                -o \
                -name "build.gradle.kts" \
                -o \
                -name "settings.gradle" \
                -o \
                -name "settings.gradle.kts" \
              )

            exit 1
          fi

          echo ""
          echo "ANDROID PROJECT:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt


      # ============================================
      # 8. SHOW PROJECT STRUCTURE
      # ============================================
      - name: Verify project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "VERIFYING PROJECT"
          echo "======================================"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo ""

          echo "Files:"
          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            | sort

          echo ""

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "WARNING: settings.gradle not found."
          fi

          if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
            echo "ERROR: Root Gradle build file not found."
            exit 1
          fi


      # ============================================
      # 9. BUILD APK
      # ============================================
      - name: Build DEBUG APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "BUILDING IDT TOOL INVENTORY APK"
          echo "======================================"

          cd "$PROJECT_DIR"

          echo ""
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Cleaning project..."

          gradle \
            --no-daemon \
            --stacktrace \
            clean

          echo ""
          echo "Building APK..."

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

          echo ""
          echo "BUILD COMPLETED."


      # ============================================
      # 10. FIND APK
      # ============================================
      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR GENERATED APK"
          echo "======================================"

          APK_FILE=$(find build-project \
            -type f \
            -name "*.apk" \
            | grep -i "debug" \
            | head -n 1 || true)

          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build-project \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)
          fi

          if [ -z "$APK_FILE" ]; then
            echo ""
            echo "ERROR: APK was not generated."
            echo ""
            echo "Searching project for APK files:"
            
            find build-project \
              -type f \
              -name "*.apk" \
              || true

            exit 1
          fi

          echo ""
          echo "APK FOUND:"
          echo "$APK_FILE"

          mkdir -p final-apk

          cp "$APK_FILE" \
            final-apk/IDT-Tool-Inventory.apk


      # ============================================
      # 11. UPLOAD APK ARTIFACT
      # ============================================
      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-APK
          path: final-apk/IDT-Tool-Inventory.apk
          if-no-files-found: error
          retention-days: 30


      # ============================================
      # 12. BUILD COMPLETE
      # ============================================
      - name: Build complete
        shell: bash
        run: |
          echo ""
          echo "======================================"
          echo "IDT TOOL INVENTORY BUILD SUCCESSFUL"
          echo "======================================"
          echo ""
          echo "APK:"
          ls -lh final-apk/IDT-Tool-Inventory.apk
