name: Build IDT Tool Inventory APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FINAL APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install Android SDK components
      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # 5. Find and extract the project ZIP
      - name: Extract Tool Inventory project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "FINDING TOOL INVENTORY PROJECT ZIP"
          echo "======================================"

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            -iname 'IDT-Tool-Inventory*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tool Inventory ZIP was not found."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf build-project
          mkdir -p build-project

          unzip -q "$ZIP_FILE" -d build-project

          echo ""
          echo "Extracted files:"
          find build-project -maxdepth 4 -type f | head -100

      # 6. Locate the actual Android project
      - name: Locate Android project
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "LOCATING ANDROID GRADLE PROJECT"
          echo "======================================"

          PROJECT_DIR=""

          SETTINGS_FILE=$(find build-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Android Gradle project found."
            echo "Looking for Gradle files..."
            find build-project -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \)
            exit 1
          fi

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_dir.txt

      # 7. Build APK
      - name: Build DEBUG APK
        shell: bash
        run: |
          set -e

          PROJECT_DIR=$(cat project_dir.txt)

          echo "======================================"
          echo "BUILDING IDT TOOL INVENTORY APK"
          echo "======================================"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
            ./gradlew clean assembleDebug --stacktrace
          else
            echo "No Gradle wrapper found."
            echo "Installing Gradle 8.9..."

            cd "$GITHUB_WORKSPACE"

            wget -q \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip \
              -O gradle.zip

            unzip -q gradle.zip -d "$RUNNER_TEMP/gradle"

            export PATH="$RUNNER_TEMP/gradle/gradle-8.9/bin:$PATH"

            cd "$PROJECT_DIR"

            gradle clean assembleDebug --stacktrace
          fi

      # 8. Find generated APK
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          APK=$(find build-project \
            -type f \
            -name "*.apk" \
            | grep -i "debug" \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find build-project \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find build-project -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p final-apk
          cp "$APK" final-apk/IDT-Tool-Inventory.apk

      # 9. Upload APK
      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-APK
          path: final-apk/IDT-Tool-Inventory.apk
          if-no-files-found: error
          retention-days: 30
