name: Build IDT Tool Inventory APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build FINAL APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load latest Firebase source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -type f \
            -name 'IDT-Tool-Inventory-APP-FIREBASE-LIVE-SYNC-V*.zip' \
            -printf '%f\n' | sort -V | tail -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Firebase source ZIP found."
            exit 1
          fi

          echo "Using source ZIP: $ZIP"

          rm -rf /tmp/idt-source
          mkdir -p /tmp/idt-source

          unzip -q -o "$ZIP" -d /tmp/idt-source

          rsync -a --exclude='.git' /tmp/idt-source/ ./

          echo "Firebase source loaded."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Firebase Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/google-services.json
          test -f app/src/main/java/com/idt/toolinventory/MainActivity.kt

          echo "Firebase Android project verified."

      - name: Build DEBUG APK
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          test -f app/build/outputs/apk/debug/app-debug.apk

          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload FINAL APK
        uses: actions/upload-artifact@v4
        with:
          name: IDT-Tool-Inventory-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
